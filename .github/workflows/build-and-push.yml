name: CI/CD Pipeline - Build, Test, and Push

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-frontend:
    name: "Stage 1: Frontend Build & Verification"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js 26
        uses: actions/setup-node@v6
        with:
          node-version: "26"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Build frontend bundle
        run: npm --prefix frontend run build

  test-backend:
    name: "Stage 2: Backend Test Battery"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Verify database migrations are complete
        run: python manage.py makemigrations --check --dry-run

      - name: Run Django test suite (Accounts, Core, Retirement Engine, Backups)
        run: |
          mkdir -p data
          python manage.py test -v 2

  build-and-push:
    name: "Stage 3: Container Build & Push to GHCR"
    runs-on: ubuntu-latest
    needs: [test-frontend, test-backend]
    if: github.event_name != 'pull_request'
    permissions:
      packages: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Convert repository name to lowercase
        run: echo "GHCR_IMAGE_NAME=$(echo ghcr.io/${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Read application version
        run: echo "APP_VERSION=$(tr -d '[:space:]' < VERSION)" >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push multi-arch image to GHCR
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          build-args: |
            APP_GITHUB_REPOSITORY=${{ github.repository }}
            APP_GITHUB_DEFAULT_BRANCH=main
            APP_VERSION=${{ env.APP_VERSION }}
          tags: |
            ${{ env.GHCR_IMAGE_NAME }}:${{ env.APP_VERSION }}
            ${{ env.GHCR_IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.title=FinGlass
            org.opencontainers.image.description=FinGlass - Canadian Personal Wealth Intelligence
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.APP_VERSION }}
            version=${{ env.APP_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
