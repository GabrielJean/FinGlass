services:
  finglass-web:
    build: .
    container_name: finglass-web
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - APP_ENV=development
      - DJANGO_DEBUG=1
      - SEED_DEMO_DATA=1
      - ALLOWED_HOSTS=*
      - SESSION_COOKIE_SECURE=0
      - SECURE_SSL_REDIRECT=0
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
